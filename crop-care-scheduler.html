<style>
:root{--bg:#eef0e0;--surf:#fffdf6;--soft:#f3ecdb;--ink:#0f3d38;--mute:#587069;--line:#e1d8c2;--navy:#0f3d38;--gold:#f2674f;--lpbg:linear-gradient(160deg,#e1ecd8,#f6eedf 70%);--lnav:#f6eedf;--ok:#1f9d63;--okl:#e2f5ec;--late:#d94c3a;--latel:#fdebe8;--warn:#b97a0a;--warnl:#fdf1d9;

.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;background:var(--bg)}

.btn.big{padding:15px 24px;font-size:16px}.btn.out{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.coralo{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}.btn.out2{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35)}:root[data-theme="dark"] .btn.out,:root[data-theme="dark"] .btn.coralo{background:transparent;color:var(--ink)}
a{color:var(--gold);font-weight:700}
.lp{background:var(--lpbg);min-height:100vh;color:var(--ink)}.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--lnav);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 clamp(16px,5vw,80px);height:72px}.lnav .brand{color:var(--ink);font-size:18px}.lnav .logo{background:var(--gold);color:#fff}

<section class="sec" id="about" style="padding-top:40px"><div class="eyebrow mono">ABOUT</div><h2 class="h2">Built for the farmers of Barangay Magtaking.</h2><div class="grid g2" style="grid-template-columns:1.2fr 1fr;align-items:start;gap:40px"><p class="lead2">Many farm tasks are still tracked in notebooks or by memory, so watering, fertilizing, and spraying can be missed and records are hard to find later. Crop Care Scheduler puts farm activity scheduling and completion monitoring in one web based system, so every farmer can see what needs to be done and what has been finished.</p>
<div>${[['Forgotten tasks','Schedules and reminders keep every job on time.'],['Scattered records','Crop, harvest, and expense records stay in one place.'],['Unclear progress','Completion rates show how the season is going.']].map(a=>`<div class="task first" style="border-top:1px solid var(--line)"><div class="ic" style="--c:var(--gold)">${tick}</div><div><b>${a[0]}</b><div class="ts">${a[1]}</div></div></div>`).join('')}</div></div></section>
<section class="sec" style="padding-top:20px"><div class="eyebrow mono">SEE IT IN ACTION</div><h2 class="h2">Your whole farm day on one screen.</h2><div class="mock"><div class="mbar"><i></i><i></i><i></i><span class="mono">Crop Care Scheduler · Dashboard</span></div><div class="mbody"><div class="card date" style="grid-row:auto;flex-direction:column;align-items:flex-start;gap:6px"><small class="mono">${new Date().toLocaleDateString('en-PH',{weekday:'long',month:'long'}).toUpperCase()}</small><div class="n">${new Date().getDate()}</div><div style="display:flex;align-items:center;gap:12px">${ring(rate(now),84)}<small>${now.filter(t=>t.done).length} of ${now.length}<br>done today</small></div><div class="streak">${svg(FLAME,16,2.4)} ${streak()} day streak</div></div><div class="card"><h2>To do today</h2>${mk.map((t,i)=>`<div class="task ${t.done?'done':''} ${i==0?'first':''}" style="--c:${col(t.type)}"><span class="chk">${tick}</span><div class="ic">${svg(P[t.type])}</div><div><div class="tt">${t.type} · ${cn(t.crop).name}</div><div class="ts">${t.note||'No note'}</div></div><span class="tag tg ${st(t)=='late'?'late':t.done?'ok':''}">${st(t)=='late'?'Overdue':t.done?'Done':'Today'}</span></div>`).join('')}</div></div></div></section>
<section class="sec" id="features" style="padding-top:20px"><div class="eyebrow mono">FEATURES</div><h2 class="h2">Everything a farm needs to stay on schedule.</h2><div class="fgrid">${F.map(f=>`<div class="fcard"><div class="ic" style="--c:${col(f[2])}">${svg(P[f[2]],22)}</div><h3 style="font-size:18px;margin-bottom:6px">${f[0]}</h3><p class="ts" style="margin:0;font-size:14px">${f[1]}</p></div>`).join('')}</div></section>
<section class="sec" id="guide" style="padding-top:20px"><div class="eyebrow mono">PLANTING GUIDE</div><h2 class="h2">What should you plant this month?</h2><div id="lpv">${lpvHTML()}</div></section>
<section class="sec" id="how" style="padding-top:20px"><div class="eyebrow mono">HOW IT WORKS</div><h2 class="h2">Four simple steps.</h2><div class="steps">${H.map((h,i)=>`<div class="step"><div class="mono">0${i+1}</div><h3 style="font-size:19px;margin:6px 0">${h[0]}</h3><p class="ts" style="margin:0">${h[1]}</p></div>`).join('')}</div></section>
<section class="sec" id="faq" style="padding-top:20px"><div class="eyebrow mono">QUESTIONS</div><h2 class="h2">Good to know.</h2><div style="max-width:820px">${[['Do I need to install anything?','No. It is a web based system, so you open it in your phone or computer browser.'],['Does it work on a phone?','Yes. The layout is made for phones, with a bottom menu and big buttons you can tap in the field.'],['Where is my data saved?','In this prototype, your records are saved in your own browser on this device. A full version would use a database so records can be shared and backed up.'],['Do I need internet?','You need a connection to open the system. Reminders are shown inside the app.'],['Who can use it?','Farmers manage their own crops and activities. Administrators can view the whole barangay overview.']].map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div></section>
<section class="sec" style="padding-top:20px"><div class="band"><div><h2 class="h2" style="margin:0 0 6px;color:#fff">Ready to plan your next season?</h2><p style="margin:0;color:#c9ddd8">Create a free farm account and set up your first crop in minutes.</p></div><button class="btn big" style="background:var(--gold);color:#0f3d38;box-shadow:none" onclick="go2('signup')">Create your farm account →</button></div></section>
<div class="foot mono">Crop Care Scheduler · Capstone project, Binalatongan Community College · Barangay Magtaking, San Carlos City, Pangasinan<br>Developed by Veloria, Juan, Deogracias, Aquino, and Muñoz</div></div>`}
function authView(m){const up=m=='signup';return `<div class="login"><div class="lv"><div class="brand">${LOGO}Crop Care Scheduler</div><div><div class="eyebrow mono" style="color:#c9ddd8">${up?'JOIN THE SEASON':'WELCOME BACK'}</div><h1>Plan every task. <span>Finish every season strong.</span></h1><p style="margin-top:18px">Schedule crop care, track what is done, log harvests, and never miss a watering or spray again.</p></div><div><button class="btn out2" onclick="go2('landing')">← Back to home</button></div></div>
<div class="lf"><div class="fm"><h2>${up?'Create your account':'Sign in'}</h2><p style="color:var(--mute);margin:0">${up?'Set up your farm account to start scheduling.':'Use your farm account to continue.'}</p>
${up?`<label for="sn">Full name</label><input id="sn" placeholder="e.g. Juan dela Cruz" autocomplete="name"><label for="sb">Barangay</label><input id="sb" value="Magtaking">`:`<label>Sign in as</label><div class="roles"><label><input type="radio" name="r" value="Farmer" checked>Farmer</label><label><input type="radio" name="r" value="Admin">Admin</label></div><label for="u">Username</label><input id="u" value="juan.delacruz" autocomplete="username">`}
<label for="pw">Password</label><input id="pw" type="password" ${up?'':'value="password"'} autocomplete="${up?'new-password':'current-password'}"><button type="button" class="btn gold" onclick="${up?'signUp()':'signIn()'}">${up?'Create account':'Sign in'}</button>
<p class="ts" style="text-align:center;margin:18px 0 0">${up?'Already have an account? <a href="#" onclick="event.preventDefault();go2(\'login\')">Sign in</a>':'New here? <a href="#" onclick="event.preventDefault();go2(\'signup\')">Create an account</a>'}</p></div></div></div>`}
function reveal(){if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);if(e.target.classList.contains('stat')){const b=e.target.querySelector('b');cnt(b,+b.dataset.n)}}}),{threshold:.12});document.querySelectorAll('.lp .fcard,.lp .step,.lp .band,.lp .stat,.lp details,.lp .sec .h2,.lp .sec .eyebrow,.lp .task').forEach((el,i)=>{el.classList.add('rv');if(el.classList.contains('stat'))el.querySelector('b').textContent='0';el.style.transitionDelay=(i%4)*70+'ms';io.observe(el)})}
function cnt(el,n){let t0;const f=ts=>{t0=t0||ts;const p=Math.min((ts-t0)/1100,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function animateNums(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('.kpi b,.date .n').forEach(el=>{if(/^\d+$/.test(el.textContent.trim()))cnt(el,+el.textContent)})}
function burst(){const b=document.querySelector('.popit .chk');if(!b||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=b.getBoundingClientRect();for(let i=0;i<16;i++){const e=document.createElement('i');e.className='cf';const a=Math.PI*2*i/16,d=42+Math.random()*34;e.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;background:${['#f2674f','#0f3d38','#f5c542','#1f9d63'][i%4]}`;document.body.appendChild(e);setTimeout(()=>e.remove(),800)}}
function after(){if(window._lv!==view){window._lv=view;animateNums()}burst();window._pop=null;badgeCheck()}
const FLAME='M12 2c1 4 5 6 5 11a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z';
function streak(){let n=0,d=TODAY;if(!S.tasks.some(t=>t.done&&t.doneOn==d))d=add(-1);while(S.tasks.some(t=>t.done&&t.doneOn==d)){n++;d=addTo(d,-1)}return n}
function theme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'}
function plant(g){const h=16+g*14,L=[...Array(Math.min(g+1,4))];return `<svg viewBox="0 0 80 90" aria-hidden="true"><g class="sway"><path d="M40 86V${86-h}" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>${L.map((_,i)=>{const y=(74-i*(h/4.2)).toFixed(1),d=i%2?1:-1;return `<path d="M40 ${y}q${d*22} -4 ${d*26} -22q${-d*22} 2 ${-d*26} 22z" fill="#fff" opacity=".92"/>`}).join('')}${g>=2?`<circle cx="40" cy="${86-h-4}" r="${g==2?6:5}" fill="${g==2?'#fff':'#f5c542'}"/>`:''}${g>=3?`<circle cx="29" cy="${(86-h/2).toFixed(1)}" r="5" fill="#f5c542"/><circle cx="51" cy="${(86-h/1.7).toFixed(1)}" r="5" fill="#f5c542"/>`:''}</g><path d="M6 86h68" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/></svg>`}
let lmon=new Date().getMonth();
function lpvHTML(){const l=GD.filter(g=>g.m.includes(lmon));return `<div class="chips">${GM.map((m,i)=>`<button class="chip ${i==lmon?'on':''}" onclick="lm(${i})">${m.slice(0,3)}</button>`).join('')}</div><p class="lead2" style="margin-bottom:18px">${GN[lmon]}</p><div class="fgrid">${l.length?l.slice(0,8).map(g=>`<div class="fcard" style="border-top:5px solid ${g.c}"><h3 style="font-size:18px">${g.n}</h3><div class="ts mono" style="font-size:12px;margin:2px 0 8px">${g.l.toUpperCase()}</div><p class="ts" style="margin:0;font-size:14px">${g.t}. Ready in about ${g.d} days.</p></div>`).join(''):'<p class="ts">No crops marked for this month.</p>'}</div><p class="ts" style="margin-top:14px">Sign in to see the full step by step guide for each crop.</p>`}
function lm(i){lmon=i;document.getElementById('lpv').innerHTML=lpvHTML()}
function tilt(){if(matchMedia('(prefers-reduced-motion:reduce)').matches||!matchMedia('(hover:hover)').matches)return;document.querySelectorAll('.sample,.mock').forEach(el=>{el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(900px) rotateY(${(x*7).toFixed(2)}deg) rotateX(${(-y*7).toFixed(2)}deg)`});el.addEventListener('mouseleave',()=>el.style.transform='')})}
addEventListener('scroll',()=>{const e=document.getElementById('sprog');if(e){const h=document.documentElement;e.style.width=(h.scrollTop/Math.max(h.scrollHeight-h.clientHeight,1)*100)+'%'}},{passive:true});
function finMini(){const ms=[...Array(6)].map((_,i)=>{const d=new Date(TODAY+'T00:00');d.setMonth(d.getMonth()-5+i,1);const k=iso(d).slice(0,7);return{n:d.toLocaleDateString('en-PH',{month:'short'}),i:S.harvests.filter(h=>h.date.startsWith(k)).reduce((a,h)=>a+h.qty*h.price,0),e:S.expenses.filter(h=>h.date.startsWith(k)).reduce((a,h)=>a+h.amount,0)}}),m=Math.max(...ms.flatMap(x=>[x.i,x.e]),1),net=ms.reduce((a,x)=>a+x.i-x.e,0);
return `<div class="card"><h2>Money, last 6 months <button class="btn ghost sm" onclick="go('finance')">Open finance</button></h2><div class="chart" style="height:160px">${ms.map(x=>`<div><span class="pair" style="height:112px"><i style="height:${x.i/m*100}%;background:var(--ok)" title="Income ${peso(x.i)}"></i><i style="height:${x.e/m*100}%;background:var(--late)" title="Expenses ${peso(x.e)}"></i></span><span>${x.n}</span></div>`).join('')}</div><p class="ts" style="margin:10px 0 0"><b style="color:var(--ok)">■</b> income <b style="color:var(--late)">■</b> expenses · net <b>${peso(net)}</b></p></div>`}
function badgeList(){const done=S.tasks.filter(t=>t.done),by={};S.tasks.forEach(t=>{(by[t.date]=by[t.date]||[]).push(t)});const perfect=Object.keys(by).some(d=>d<=TODAY&&by[d].length>=2&&by[d].every(t=>t.done)),inc=S.harvests.reduce((a,h)=>a+h.qty*h.price,0),exp=S.expenses.reduce((a,e)=>a+e.amount,0);
return [['first','First step','Finish your first activity','M5 12.5l4.5 4.5L19 7.5',done.length>0],['streak','On a roll','Keep a 3 day streak',FLAME,streak()>=3],['perfect','Perfect day','Finish every activity in a day','M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z',perfect],['clear','All caught up','Have no overdue activities','M12 2l9 4v6c0 5-4 9-9 10-5-1-9-5-9-10V6z',done.length>0&&!S.tasks.some(t=>st(t)=='late')],['ten','Hard worker','Finish 10 activities','M3 12l6 6L21 6',done.length>=10],['green','Green thumb','Grow 3 crops',P.Planting,S.crops.length>=3],['rec','Record keeper','Log 3 observations',P.Inspection,S.logs.length>=3],['harv','First harvest','Record a harvest',P.Harvesting,S.harvests.length>0],['profit','In the green','Earn more than you spend','M12 2a10 10 0 100 20 10 10 0 000-20zM12 6v12M9 9h5a2 2 0 010 4h-4a2 2 0 000 4h5',inc>exp&&inc>0]]}
function badgesCard(){const b=badgeList(),n=b.filter(x=>x[4]).length;return `<div class="card"><h2>Achievements <span class="tag ok">${n} of ${b.length}</span></h2><div class="bdg">${b.map(x=>`<div class="bd1 ${x[4]?'on':''}" title="${x[2]}"><span>${svg(x[3],22,2)}</span><b>${x[1]}</b><small>${x[4]?'Unlocked':x[2]}</small></div>`).join('')}</div></div>`}
function badgeCheck(){const L=badgeList(),ids=L.filter(x=>x[4]).map(x=>x[0]);if(!S.bd){S.bd=ids;save();return}const nw=ids.filter(i=>!S.bd.includes(i));if(nw.length){S.bd=ids;save();const nm=L.find(x=>x[0]==nw[0])[1];setTimeout(()=>toast('Badge unlocked: '+nm,2800),700)}}
function openCmd(){if(!role)return;closeCmd();const c=document.createElement('div');c.id='cmd';c.innerHTML='<div class="cbox" role="dialog" aria-label="Quick search"><input id="cq" placeholder="Search pages, crops, activities, guide…  (Esc to close)" aria-label="Quick search" autocomplete="off"><div id="cres"></div></div>';document.body.appendChild(c);c.onclick=e=>{if(e.target==c)closeCmd()};const q=c.querySelector('#cq');q.oninput=()=>cmdRes(q.value);q.onkeydown=e=>{if(e.key=='Enter'){const f=document.querySelector('#cres button');if(f)f.click()}};cmdRes('');q.focus()}
function closeCmd(){const c=document.getElementById('cmd');if(c)c.remove()}
function cmdRes(v){const q=v.trim().toLowerCase(),R=[];NAV.filter(n=>n[0]!='admin'||role=='Admin').forEach(n=>R.push(['Page',n[1],`go('${n[0]}')`]));S.crops.forEach(c=>R.push(['Crop',c.name,`go('crops')`]));GD.forEach(g=>R.push(['Guide',g.n+' ('+g.l+')',`gs('${g.k}');go('guide')`]));S.tasks.filter(t=>!t.done).slice(0,80).forEach(t=>R.push(['Activity',t.type+' · '+cn(t.crop).name+' · '+fmt(t.date),`openTask(${t.id})`]));
const m=R.filter(r=>!q||r[1].toLowerCase().includes(q)||r[0].toLowerCase().includes(q)).slice(0,9);document.getElementById('cres').innerHTML=m.length?m.map(r=>`<button onclick="closeCmd();${r[2]}"><span class="tag">${r[0]}</span>${r[1]}</button>`).join(''):'<div class="empty">No results</div>'}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();openCmd()}if(e.key=='Escape')closeCmd()});
setTimeout(()=>{const sp=document.getElementById('splash');if(sp){sp.classList.add('out');setTimeout(()=>sp.remove(),700)}},matchMedia('(prefers-reduced-motion:reduce)').matches?200:1500);
function adv(id){const c=S.crops.find(x=>x.id==id);c.stage++;save();toast(c.name+' is now in '+STAGES[c.stage]+' stage');render()}
function go(v){location.hash=v}
function notes(){const a=[];S.tasks.filter(t=>!t.done&&t.date<TODAY).forEach(t=>a.push(['late',t.type+' · '+cn(t.crop).name+' is overdue']));S.tasks.filter(t=>!t.done&&t.date==TODAY).forEach(t=>a.push(['warn',t.type+' · '+cn(t.crop).name+' today at '+(t.time||'any time')]));S.tasks.filter(t=>!t.done&&t.date==add(1)).forEach(t=>a.push(['',t.type+' · '+cn(t.crop).name+' tomorrow']));S.logs.filter(l=>l.health=='Problem').forEach(l=>a.push(['late',cn(l.crop).name+': '+(l.issue||'needs attention')]));S.inputs.filter(i=>i.qty<=i.min).forEach(i=>a.push(['late','Low stock: '+i.name+' ('+i.qty+' '+i.unit+' left)']));return a}
function loginView(){return `<div class="login"><div class="lv"><div class="brand"><div class="logo">${svg(P.Planting,20,2.4)}</div>Crop Care Scheduler</div><div><h1>Plan every task. <span>Finish every season strong.</span></h1><p style="margin-top:18px">Schedule crop care, track what is done, log harvests, and never miss a watering or spray again.</p></div><p style="font-size:13px;margin:0">Barangay Magtaking, San Carlos City, Pangasinan</p></div>
<div class="lf"><div class="fm"><h2>Sign in</h2><p style="color:var(--mute);margin:0">Use your farm account to continue.</p><label>Sign in as</label><div class="roles"><label><input type="radio" name="r" value="Farmer" checked>Farmer</label><label><input type="radio" name="r" value="Admin">Admin</label></div><label for="u">Username</label><input id="u" value="juan.delacruz" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" value="password" autocomplete="current-password"><button type="button" class="btn gold" onclick="signIn()">Sign in</button></div></div></div>`}
function render(){if(!role){$('#root').innerHTML=scr=='landing'?landingView():authView(scr);if(scr=='landing'){reveal();tilt()}return}const h=location.hash.slice(1),nav=NAV.filter(n=>n[0]!='admin'||role=='Admin');view=V[h]&&nav.some(n=>n[0]==h)?h:'dashboard';const nt=notes();
$('#root').innerHTML=`<header><div class="brand"><div class="logo">${svg(P.Planting,20,2.4)}</div><span>Crop Care Scheduler</span></div><nav aria-label="Main">${nav.map(n=>`<a href="#${n[0]}" ${n[0]==view?'aria-current="page"':''}>${n[1]}</a>`).join('')}</nav>
<div class="hr"><button class="ib" aria-label="Quick search (Ctrl K)" title="Quick search (Ctrl+K)" onclick="openCmd()">${svg('M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5',18)}</button><button class="ib" aria-label="Toggle dark mode" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">${svg('M21 13A9 9 0 1111 3a7 7 0 0010 10z',18)}</button><button class="ib" aria-label="Notifications" onclick="$('#np').classList.toggle('on')">${svg('M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0',18)}${nt.length?`<span class="badge">${nt.length}</span>`:''}</button><button class="av" aria-label="Log out" title="Log out (${role})" onclick="role=null;scr='landing';render();window.scrollTo(0,0)">${role=='Admin'?'AD':UI}</button>
